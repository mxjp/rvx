name: Release

on:
  push:
    tags:
      - v*

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Release
        if: ${{ !contains(github.ref_name, '-next') }}
        run: npm publish
      - name: Release next
        if: ${{ contains(github.ref_name, '-next') }}
        run: npm publish --tag next
